name: Build Windows

# 仅手动触发：GitHub → Actions → Build Windows → Run workflow
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 版本号（如 v0.1.0）；留空则从 build/config.yml 的 info.version 推导
        required: false
        type: string
      publish:
        description: 发布到 Releases（会自动打 tag 并上传 exe）
        required: false
        default: false
        type: boolean
      notes:
        description: 发布说明；留空则交由 GitHub 自动生成
        required: false
        type: string

concurrency:
  group: build-windows-${{ github.ref }}
  # 手动触发，且可能在发布，不要中途取消
  cancel-in-progress: false

# 打 tag 与创建 Release 需要写权限
permissions:
  contents: write

env:
  APP_NAME: playbook-studio
  # 与 go.mod 里 require 的 wails v3 版本保持一致，避免 CLI 与库版本错配
  WAILS3_VERSION: v3.0.0-beta.20
  NODE_VERSION: "22"

jobs:
  build:
    name: Build Windows x64 (cross-compile on Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # Go 版本直接取自 go.mod 的 go 指令
      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Vite 8 需要 Node 20.19+ / 22.12+
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 关键：必须 CGO_ENABLED=0。
      # Ubuntu runner 默认开启 cgo（有 gcc），会把 Linux 的 GTK 代码编进来，
      # 而 runner 未安装 libgtk-3-dev 之类的开发库，导致 go install 失败。
      # wails3 CLI 自身不需要 cgo，关掉即可；失败时输出会以注解形式暴露出来。
      - name: 安装 Wails v3 CLI
        run: |
          set -o pipefail
          echo "go: $(go version)"
          echo "GOPROXY=$(go env GOPROXY)  GOTOOLCHAIN=$(go env GOTOOLCHAIN)"
          mod="github.com/wailsapp/wails/v3/cmd/wails3@${WAILS3_VERSION}"
          bin="$(go env GOPATH)/bin/wails3"
          out=""
          for attempt in 1 2 3; do
            echo "==> go install ${mod}（第 ${attempt} 次）"
            if out=$(CGO_ENABLED=0 go install "${mod}" 2>&1); then
              echo "==> 安装成功"
              break
            fi
            echo "==> 第 ${attempt} 次失败，输出如下："
            printf '%s\n' "${out}"
            sleep 15
          done
          if [ ! -x "${bin}" ]; then
            msg=$(printf '%s' "${out}" | tail -n 20 | tr '\n' '~' | tr -d '%')
            echo "::error title=wails3 安装失败::${msg}"
            exit 1
          fi
          echo "$(dirname "${bin}")" >> "$GITHUB_PATH"
          "${bin}" version

      - name: 环境自检
        run: |
          wails3 version
          go version
          node -v

      # 版本号：优先用手动输入，留空则从 build/config.yml 的 info.version 推导
      - name: 解析版本号
        id: meta
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -eo pipefail
          tag=$(python3 - "$TAG_INPUT" <<'PY'
          import re, sys

          given = (sys.argv[1] or "").strip()
          if given:
              t = given if given.startswith("v") else "v" + given
          else:
              txt = open("build/config.yml", encoding="utf-8").read()
              m = re.search(r"^info:\s*$", txt, re.M)
              seg = txt[m.end():] if m else txt
              v = re.search(r"^\s+version:\s*['\"]?([0-9][0-9A-Za-z.\-+]*)['\"]?", seg, re.M)
              if not v:
                  sys.exit("无法从 build/config.yml 的 info.version 读取版本号，请手动填写 tag")
              t = "v" + v.group(1)

          if not re.fullmatch(r"v[0-9][0-9A-Za-z.\-+]*", t):
              sys.exit(f"版本号格式不合法: {t}")
          print(t)
          PY
          )
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "版本号: $tag"

      # 程序把 7-Zip 独立控制台版（7zr.exe）经 go:embed 编译进二进制，
      # 首次运行释放到 %LOCALAPPDATA%\PlaybookStudio\tools，目标机器无需安装 7-Zip。
      # 该文件是 go:embed 的必需输入，必须随仓库提交（.gitignore 不能用裸 bin 规则屏蔽）。
      - name: 校验内置 7-Zip
        run: |
          python3 - <<'PY'
          import pathlib, struct, sys

          exe = pathlib.Path("internal/sevenzip/bin/7zr.exe")
          license = pathlib.Path("internal/sevenzip/bin/LICENSE-7zip.txt")
          for f in (exe, license):
              if not f.is_file():
                  sys.exit(f"缺少内嵌 7-Zip 文件：{f}（被 go:embed 引用，必须提交到仓库）")

          data = exe.read_bytes()
          pe = struct.unpack_from("<I", data, 0x3C)[0]
          machine = struct.unpack_from("<H", data, pe + 4)[0]
          print(f"{exe.name}: {len(data) / 1024:.1f} KB, Machine=0x{machine:04X}")

          if len(data) < 100_000:
              sys.exit("7zr.exe 体积异常，文件可能不完整")

          # 7-Zip 官方只发布 x86 版 7zr.exe（0x014C），在 x64 Windows 上原生运行
          if machine != 0x014C:
              print(f"提示：官方 7zr.exe 通常为 x86 (0x014C)，当前是 0x{machine:04X}")
          PY

      # 必须点名 windows:build —— 顶层的 build 任务按宿主系统(GOOS=linux)分发，
      # 在 Ubuntu 上直接 `wails3 build` 会构建 Linux 版本。
      # windows:build 在 CGO_ENABLED=0（默认）下走 build:native，即纯 Go 交叉编译。
      # 产物：bin/playbook-studio.exe（免安装，双击即可运行）
      - name: 交叉编译 Windows 版本
        run: wails3 task windows:build

      - name: 核对产物并断言 x64
        run: |
          set -eo pipefail
          exe="bin/$APP_NAME.exe"
          test -f "$exe" || { echo "未找到构建产物：$exe"; exit 1; }

          out="bin/$APP_NAME-${{ steps.meta.outputs.tag }}-windows-amd64.exe"
          cp "$exe" "$out"

          python3 - "$out" <<'PY'
          import pathlib, struct, sys

          p = pathlib.Path(sys.argv[1])
          data = p.read_bytes()
          pe = struct.unpack_from("<I", data, 0x3C)[0]
          machine = struct.unpack_from("<H", data, pe + 4)[0]

          if machine != 0x8664:
              sys.exit(f"产物不是 x64，Machine=0x{machine:04X}")

          print(f"产物架构校验通过：x64 (0x8664)，{len(data) / 1024 / 1024:.2f} MB")
          PY

          ls -lh bin

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ steps.meta.outputs.tag }}-windows-amd64
          path: bin/${{ env.APP_NAME }}-${{ steps.meta.outputs.tag }}-windows-amd64.exe
          if-no-files-found: error
          retention-days: 30

      # 勾选 publish 时才会执行：打 tag（轻量 tag，不需要提交者身份）→ 创建 Release
      - name: 打 tag 并发布到 Releases
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -eo pipefail
          asset="bin/$APP_NAME-$TAG-windows-amd64.exe"
          test -f "$asset" || { echo "未找到待发布产物：$asset"; exit 1; }

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG 已存在，直接复用"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "已创建并推送 tag $TAG"
          fi

          if [ -n "$NOTES" ]; then
            gh release create "$TAG" "$asset" --title "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$asset" --title "$TAG" --generate-notes
          fi
